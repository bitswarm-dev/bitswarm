name: Feature request
description: Suggest an improvement or a new feature
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Check the README's "Not supported yet" list first. If your idea is on it, say what you need it for.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like BitSwarm to do
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Other ways you've tried
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I'm willing to work on this
