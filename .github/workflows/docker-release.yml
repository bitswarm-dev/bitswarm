name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      latest: ${{ steps.v.outputs.latest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - id: v
        run: |
          set -eu
          printf '%s' "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$' || { echo "Tag must look like v1.2.3 or v1.2.3-rc.1"; exit 1; }
          version="${RELEASE_TAG#v}"
          base="${version%%-*}"
          line="${base%.*}"
          branch="release/$line"
          on_main=false
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main && on_main=true
          on_line=false
          if git show-ref --verify --quiet "refs/remotes/origin/$branch"; then
            git merge-base --is-ancestor "$GITHUB_SHA" "origin/$branch" && on_line=true
          fi
          [ "$on_main" = true ] || [ "$on_line" = true ] || { echo "Tag $RELEASE_TAG isn't on main or $branch. Tag a commit from one of them."; exit 1; }
          prerelease=false
          case "$version" in *-rc.*) prerelease=true;; esac
          latest=false
          if [ "$prerelease" = "false" ]; then
            highest=$(git tag -l 'v[0-9]*' | grep -Ev -- '-rc\.' | sort -V | tail -1)
            [ "$highest" = "$RELEASE_TAG" ] && latest=true
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

      - env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.v.outputs.prerelease }}
          LATEST: ${{ steps.v.outputs.latest }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -eu
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists. Adding the build to it."
            exit 0
          fi
          flags=""
          if [ "$PRERELEASE" = "true" ]; then flags="--prerelease"; elif [ "$LATEST" != "true" ]; then flags="--latest=false"; fi
          notes="docs/release-notes/v$VERSION.md"
          if [ -f "$notes" ]; then
            gh release create "$RELEASE_TAG" --verify-tag --title "BitSwarm $VERSION" $flags --notes-file "$notes"
            exit 0
          fi
          gh release create "$RELEASE_TAG" --verify-tag --title "BitSwarm $VERSION" --generate-notes $flags \
            --notes "Docker images for linux/amd64, arm64, arm/v7 and 386 are on Docker Hub as dockerkeithics/bitswarm-server and dockerkeithics/bitswarm-web. Server binaries for Linux, macOS and Windows and the dashboard build are attached, with SHA256SUMS. Licensed under the PolyForm Noncommercial License 1.0.0."

  images:
    needs: prepare
    runs-on: ubuntu-latest
    env:
      LATEST: ${{ needs.prepare.outputs.latest }}
    strategy:
      fail-fast: false
      matrix:
        component: [server, web]
        platform: [linux/amd64, linux/arm64, linux/arm/v7, linux/386]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - id: v
        run: |
          set -eu
          printf '%s' "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$' || { echo "Tag must look like v1.2.3 or v1.2.3-rc.1"; exit 1; }
          version="${RELEASE_TAG#v}"
          suffix="${{ matrix.platform }}"
          suffix="${suffix#linux/}"
          suffix="${suffix//\//-}"
          tags="dockerkeithics/bitswarm-${{ matrix.component }}:${version}-${suffix}"
          if [ "$LATEST" = "true" ]; then
            tags="${tags},dockerkeithics/bitswarm-${{ matrix.component }}:latest-${suffix}"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
          if [ "${{ matrix.component }}" = "server" ]; then echo "context=./server" >> "$GITHUB_OUTPUT"; else echo "context=./dashboard" >> "$GITHUB_OUTPUT"; fi

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: ${{ steps.v.outputs.context }}
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          tags: ${{ steps.v.outputs.tags }}
          build-args: APP_VERSION=${{ needs.prepare.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.component }}-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}-${{ matrix.platform }}

  manifest:
    needs: [prepare, images]
    runs-on: ubuntu-latest
    env:
      LATEST: ${{ needs.prepare.outputs.latest }}
    strategy:
      matrix:
        component: [server, web]
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - run: |
          set -eu
          printf '%s' "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$'
          version="${RELEASE_TAG#v}"
          image="dockerkeithics/bitswarm-${{ matrix.component }}"
          suffixes="amd64 arm64 arm-v7 386"
          sources=""
          for s in $suffixes; do sources="$sources ${image}:${version}-${s}"; done
          docker buildx imagetools create -t "${image}:${version}" $sources
          if [ "$LATEST" = "true" ]; then
            sources=""
            for s in $suffixes; do sources="$sources ${image}:latest-${s}"; done
            docker buildx imagetools create -t "${image}:latest" $sources
          fi

  binaries:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: server/go.mod

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          printf '%s' "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$'
          version="${RELEASE_TAG#v}"
          out="$PWD/out"
          mkdir -p "$out" build
          for t in linux/amd64 linux/arm64 linux/arm/7 linux/386 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${t%%/*}"
            rest="${t#*/}"
            arch="${rest%%/*}"
            arm=""
            label="$arch"
            if [ "$arch" = "arm" ]; then arm="${rest#arm/}"; label="armv${arm}"; fi
            name="bitswarm-server_${version}_${os}_${label}"
            bin="swarm"
            if [ "$os" = "windows" ]; then bin="swarm.exe"; fi
            rm -rf "build/$name"
            mkdir -p "build/$name"
            (cd server && CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" GOARM="$arm" go build -trimpath -ldflags="-s -w -X bitswarm/server/internal/buildinfo.Version=$version" -o "../build/$name/$bin" ./cmd/server)
            cp README.md LICENSE THIRD_PARTY_NOTICES.md "build/$name/"
            if [ "$os" = "windows" ]; then
              (cd build && zip -qr "$out/$name.zip" "$name")
            else
              tar -C build -czf "$out/$name.tar.gz" "$name"
            fi
          done
          (cd dashboard && npm ci && VITE_APP_VERSION="$version" npx vite build)
          tar -C dashboard/dist -czf "$out/bitswarm-dashboard_${version}.tar.gz" .
          sed "s/SWARM_VERSION:-[^}]*/SWARM_VERSION:-$version/g" docker-compose.yml > "$out/docker-compose.yml"
          (cd "$out" && sha256sum * > SHA256SUMS)
          gh release upload "$RELEASE_TAG" "$out"/* --clobber
